async function rpStart(){try{const st=await navigator.mediaDevices.getUserMedia({audio:true});mr=new MediaRecorder(st,{audioBitsPerSecond:32000});ch=[];mr.ondataavailable=e=>ch.push(e.data);mr.onstop=()=>{st.getTracks().forEach(t=>t.stop());RP.blob=new Blob(ch,{type:mr.mimeType||"audio/webm"});RP.url=URL.createObjectURL(RP.blob);RP.st="done";render()};mr.start();RP.st="rec";render()}catch(e){toast("Mikrofon nekad: "+(e&&e.name||e))}}
function rpStop(){mr&&mr.stop()}
async function rpSave(){try{toast("Laddar upp…");const u=await upl(RP.blob);await put({id:RP.id,[RP.k]:u});toast("Sparad ✔");RP=null;render()}catch(e){toast("Uppladdning misslyckades")}}
function recHtml(){if(!RP)return"";const t=RP.k==="slow"?T("slow"):T("norm");const c=RP.st==="idle"?`<button onclick="rpStart()">● Starta inspelning</button>`:RP.st==="rec"?`<b style="color:#c00">● Spelar in…</b> <button onclick="rpStop()">■ Stoppa</button>`:`<audio controls src="${RP.url}" style="width:100%"></audio><button onclick="rpSave()">Spara</button><button class="g" onclick="rpStart()">Gör om</button>`;
return`<div class="sheet"><b>🎙️ ${t}</b><div class="row">${c}</div><button class="g" onclick="RP=null;render()">Avbryt</button></div>`}
function editView(){const n=N(edId)||{name:"",body:""};return`<div class="card"><input id="et" value="${esc(n.name)}"><div class="row"><button class="g" onclick="fmt('**')"><b>B</b></button><button class="g" onclick="fmt('_')"><i>I</i></button><button class="g" onclick="fmt('# ','l')">H</button><button class="g" onclick="fmt('• ','l')">•</button><button class="g" onclick="$('#im').click()">🖼️</button><input id="im" type="file" accept="image/*" hidden onchange="addImg(this)"></div><textarea id="eb" class="ge" rows="14">${esc(n.body)}</textarea><div class="row"><button onclick="saveEd()">Spara</button><button class="g" onclick="view='x';render()">Avbryt</button></div><p class="sub">Tips: en rad = ett stycke (läsmarkering sätts per stycke).</p></div>`}
function fmt(m,l){const e=$("#eb"),a=e.selectionStart,b=e.selectionEnd,v=e.value;e.value=l?v.slice(0,a)+m+v.slice(a):v.slice(0,a)+m+v.slice(a,b)+m+v.slice(b);e.focus()}
async function addImg(i){const f=i.files[0];if(!f)return;try{const r={url:await upl(f)};$("#eb").value+="\n![bild]("+r.url+")\n"}catch(e){toast("Kunde inte ladda upp")}}
async function saveEd(){await put({id:edId,name:$("#et").value,body:$("#eb").value});view="x";render()}
function fmtLine(s){let m=s.match(/^!\[.*?\]\((.+?)\)$/);if(m)return`<img src="${esc(m[1])}" style="max-width:100%;border-radius:10px">`;s=esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/_(.+?)_/g,"<i>$1</i>");if(/^# /.test(s))return"<b style='font-size:1.15em'>"+s.slice(2)+"</b>";return s||"&nbsp;"}
function readView(n){const lines=(n.body||"").split("\n"),mk=n.mark,pl=P.place[n.id],hl=P.hl[n.id]||{};
const body=lines.map((l,i)=>`<p data-i="${i}" class="${i===mk?"mk":""} ${i===pl?"pl":""} ${hl[i]?"hl":""}" onclick="tapLine(${i})">${i===mk?"📖 ":""}${fmtLine(l)}</p>`).join("");
const au=(k,l)=>n[k]?`<div class="row"><span class="sub">${l}</span><audio controls ${sa(n[k])} style="flex:1;min-width:200px"></audio></div>`:"";
return`<div id="body" class="ge">${body||T("empty")}</div><div class="card"><div class="sub">🎧</div>${au("slow",T("slow"))}${au("normal",T("norm"))}${A()?`<div class="row"><button class="g" onclick="openRec('${n.id}','slow')">🎙️ ${T("slow")}</button><button class="g" onclick="openRec('${n.id}','normal')">🎙️ ${T("norm")}</button></div>`:""}</div>${A()?`<div class="sub">Admin: använd ➕ för att lägga till text, spela in ljud eller sätta markering.</div>`:`<div class="card"><b>✉️ ${T("send")}</b><div class="row"><button id="rb" class="g" onclick="recSub('${n.id}')">🎙️ ${T("rec")}</button><span id="rs" class="sub"></span></div><textarea id="sm" rows="2" placeholder="${T("msg")}"></textarea><div class="row"><button onclick="sendSub('${n.id}')">${T("send")}</button>${ADM?`<a href="tel:${esc(ADM)}" style="text-decoration:none"><button class="g">📞 ${T("call")}</button></a>`:'<span class="sub">Admin har inte lagt in något telefonnummer ännu</span>'}</div></div>`}`}
function tapLine(i){const n=N(path[path.length-1]);if(!n||n.type!=="t")return;if(A()){if(markMode){markMode=false;put({id:n.id,mark:n.mark===i?-1:i})}else toast("Använd ➕ → Markera")}else if(hlMode){const h=P.hl[n.id]=P.hl[n.id]||{};h[i]=!h[i];save();render()}else{P.place[n.id]=i;save();render()}}
let mr=null,ch=[],subBlob=null;
async function rec(done,btn){if(mr&&mr.state==="recording"){mr.stop();return}try{const st=await navigator.mediaDevices.getUserMedia({audio:true});mr=new MediaRecorder(st,{audioBitsPerSecond:32000});ch=[];mr.ondataavailable=e=>ch.push(e.data);mr.onstop=()=>{st.getTracks().forEach(t=>t.stop());done(new Blob(ch,{type:mr.mimeType||"audio/webm"}))};mr.start();toast("● "+T("stop"))}catch(e){toast("Mikrofon nekad")}}
async function upl(b){if(assets)return (await assets.upload(b)).url;return await new Promise((r,j)=>{const f=new FileReader();f.onload=()=>r(f.result);f.onerror=j;f.readAsDataURL(b)})}
function recFor(id,k){rec(async b=>{try{toast("Laddar upp…");await put({id,[k]:await upl(b)});toast("Sparad")}catch(e){toast("Uppladdning kräver redigerarbehörighet")}})}
function recSub(id){rec(b=>{subBlob=b;$("#rs").textContent="✔ inspelad"})}
async function sendSub(tid){const m=$("#sm").value.trim();if(!subBlob&&!m)return;let a="";try{if(subBlob)a=await upl(subBlob)}catch(e){toast("Kunde inte ladda upp ljud")}
const id="s"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),base={uid:S.uid,text:N(tid).name,status:"ny"};await db.collection("subs").doc(id).set({...base,tid,name:S.name,phone:S.phone,audio:a,msg:m,at:Date.now()});await db.collection("fb").doc(id).set(base);subBlob=null;toast("Skickat ✔");render()}
function subsView(){if(!subs.length)return`<p class="sub">${T("empty")}</p>`;return subs.sort((a,b)=>b.at-a.at).map(s=>`<div class="card"><b>${esc(s.name)}</b> · <a href="tel:${esc(s.phone)}">${esc(s.phone)}</a><div class="sub ge">${esc(s.text)} · ${new Date(s.at).toLocaleDateString()} <span class="tag">${esc(s.status)}</span> ${esc(s.emoji||"")}</div>${s.msg?`<p>${esc(s.msg)}</p>`:""}${s.audio?`<audio controls ${sa(s.audio)} style="width:100%"></audio>`:""}${s.comment?`<p>💬 ${esc(s.comment)}</p>`:""}${s.deadline?`<p>⏰ ${esc(s.deadline)}</p>`:""}<div class="row"><button class="g" onclick="cm('${s.id}')">💬</button><button class="g" onclick="em('${s.id}')">😀</button><button class="g" onclick="dl('${s.id}')">⏰</button><button class="g" onclick="rs('${s.id}')">🔁</button></div></div>`).join("")}
const up=async(id,d)=>{await db.collection("subs").doc(id).update(d);await db.collection("fb").doc(id).update(d)};
const cm=async id=>{const c=await ask("Kommentar / rekommendation");if(c)up(id,{comment:c})},em=async id=>{const e=await ask("Emoji","👍");if(e)up(id,{emoji:e})},dl=async id=>{const d=await ask("Deadline (ÅÅÅÅ-MM-DD)");if(d)up(id,{deadline:d})},rs=id=>up(id,{status:"spela in igen"});
function listView(p,type){const ks=kids(p,type);if(!ks.length)return`<p class="sub">${T("empty")}</p>`;return ks.map(n=>`<div class="item" onclick="${selMode?`tg('${n.id}')`:`go('${n.id}')`}">${selMode?`<span>${sel.has(n.id)?"☑️":"⬜"}</span>`:""}<span class="n ge">${esc(n.name)}</span>${P.fav[n.id]?"⭐":""}${P.read[n.id]?"✅":""}<span class="sub">›</span></div>`).join("")}
const tg=id=>{sel.has(id)?sel.delete(id):sel.add(id);render()};
function setView(){return`<div class="card"><b>${T("lang")}</b><select onchange="S.lang=this.value;save();render()">${Object.keys(LN).map(k=>`<option value="${k}" ${S.lang===k?"selected":""}>${LN[k]}</option>`).join("")}</select><p class="sub">Gränssnittet byts, texterna förblir Ge'ez/amhariska.</p></div>
<div class="card"><b>${T("notif")}</b><label class="row"><input type="checkbox" style="width:auto" ${S.notif!==false?"checked":""} onchange="S.notif=this.checked;save()"> Dagliga påminnelser &amp; deadlines (visas i appen)</label></div>
<div class="card"><b>${T("prof")}</b><input value="${esc(S.name)}" onchange="S.name=this.value;save()" placeholder="${T("name")}"><input value="${esc(S.phone)}" onchange="S.phone=this.value;save()" placeholder="${T("phone")}">${A()?`<p class="sub">Admin: ditt nummer visas för användare via "Ring admin".</p><button class="g" onclick="setAP()">📞 Sätt admin-nummer</button>`:""}</div><button class="g" onclick="doOut()">${T("out")}</button>`}
async function setAP(){const p=await ask("Ditt telefonnummer som användarna ringer",S.phone||ADM||"");if(!p)return;S.phone=p;save();try{await db.collection("meta").doc("admin").set({phone:p});toast("Sparat ✔")}catch(e){toast("Kunde inte spara: "+(e&&(e.message||e.code)||e))}}
function banner(){if(S.notif===false||A())return"";const mine=fbs.filter(s=>s.uid===S.uid);let h="";mine.forEach(s=>{if(s.comment)h+=`<div class="card">💬 ${esc(s.text)}: ${esc(s.comment)} ${esc(s.emoji||"")}</div>`;if(s.deadline)h+=`<div class="card">⏰ ${esc(s.text)} → ${esc(s.deadline)}</div>`;if(s.status==="spela in igen")h+=`<div class="card">🔁 Spela in igen: ${esc(s.text)}</div>`});return h}
function render(){const a=$("#app");if(!S.role){a.innerHTML=`<div class="login"><h2>🕊️ ውዳሴ ማርያም</h2><input id="pw" type="password" placeholder="${T("pw")}" autocomplete="off"><input id="nm" placeholder="${T("name")}"><input id="ph" type="tel" placeholder="${T("phone")}"><button style="width:100%" onclick="login()">${T("login")}</button><p class="sub">${T("name")} + ${T("phone")}: ${T("prof")}</p></div>`;return}
let h=topbar()+(LOCAL?'<div class="card sub">⚠️ Sparas bara på den här enheten (ingen delad databas hittades).</div>':"");const n=N(path[path.length-1]);
if(view==="set")h+=setView();else if(view==="subs"&&A())h+=subsView();else if(view==="edit")h+=editView();
else if(!db)h+=`<p class="card">Öppna sidan via din delade länk och logga in på claude.ai för att se innehållet.</p>`;
else if(view==="home"||!path.length)h+=banner()+listView("","g");
else if(n&&n.type==="g")h+=listView(n.id,"d");else if(n&&n.type==="d")h+=listView(n.id,"t");else if(n)h+=readView(n);
if(RP)h+=recHtml();a.innerHTML=h;document.querySelectorAll("audio[data-fs]").forEach(loadAudio);
if(view==="x"&&n&&n.type==="t"&&P.place[n.id]!=null&&!A()){const e=document.querySelector(`[data-i="${P.place[n.id]}"]`);e&&!window._sc&&(window._sc=1,e.scrollIntoView({block:"center"}),setTimeout(()=>window._sc=0,500))}}
if(!S.adminPhone)S.adminPhone="";
window.addEventListener("hashchange",()=>{const id=location.hash.slice(1);if(N(id)){path=[];let c=N(id);while(c){path.unshift(c.id);c=N(c.parent)}view="x";render()}});
render();init();
</script></body></html>
